<!-- @dsCard group="Overlays" height=300 subtitle="Short messages that clear themselves" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--background)}</style></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="check-circle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" vector-effect="non-scaling-stroke"/><path d="M8 12.5l3 3 5-6" vector-effect="non-scaling-stroke"/></g></symbol><symbol id="x-circle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" vector-effect="non-scaling-stroke"/><path d="M9 9l6 6" vector-effect="non-scaling-stroke"/><path d="M15 9l-6 6" vector-effect="non-scaling-stroke"/></g></symbol><symbol id="info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" vector-effect="non-scaling-stroke"/><path d="M12 11v6" vector-effect="non-scaling-stroke"/><path d="M12 7.5h.01" vector-effect="non-scaling-stroke"/></g></symbol><symbol id="close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12" vector-effect="non-scaling-stroke"/><path d="M18 6L6 18" vector-effect="non-scaling-stroke"/></g></symbol></svg>
<div class="mm-grid"><div class="mm-pane" data-theme="light"><p class="mm-pane-label">Light</p><p class="mm-sub">Success, error and neutral; icon plus text, never colour alone</p><div class="mm-stack"><div class="mm-toast mm-toast--success" role="status"><svg class="mm-ico "><use href="#check-circle"/></svg><span class="mm-toast-text">Saved.</span><button class="mm-btn">Undo</button></div><div class="mm-toast mm-toast--error" role="alert"><svg class="mm-ico "><use href="#x-circle"/></svg><span class="mm-toast-text">Couldn’t save. Check your connection.</span><button class="mm-btn">Retry</button></div><div class="mm-toast" role="status"><svg class="mm-ico "><use href="#info"/></svg><span class="mm-toast-text">Link copied.</span><svg class="mm-ico "><use href="#close"/></svg></div></div></div><div class="mm-pane" data-theme="dark"><p class="mm-pane-label">Dark</p><p class="mm-sub">Success, error and neutral; icon plus text, never colour alone</p><div class="mm-stack"><div class="mm-toast mm-toast--success" role="status"><svg class="mm-ico "><use href="#check-circle"/></svg><span class="mm-toast-text">Saved.</span><button class="mm-btn">Undo</button></div><div class="mm-toast mm-toast--error" role="alert"><svg class="mm-ico "><use href="#x-circle"/></svg><span class="mm-toast-text">Couldn’t save. Check your connection.</span><button class="mm-btn">Retry</button></div><div class="mm-toast" role="status"><svg class="mm-ico "><use href="#info"/></svg><span class="mm-toast-text">Link copied.</span><svg class="mm-ico "><use href="#close"/></svg></div></div></div></div></body></html>
