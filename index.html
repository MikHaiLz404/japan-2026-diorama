<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9f7f7" />
    <meta
      name="description"
      content="旅トレイ Japan 2026 / Trip tray — a tiny miniature diorama of the itinerary."
    />
    <meta property="og:title" content="Japan 2026 · Diorama" />
    <meta
      property="og:description"
      content="Interactive Three.js trip tray for Japan 2026 — tap a city to zoom into lodging and activities."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://japan-2026-diorama.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Japan 2026 · Diorama</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-hidden="true"></div>

      <a
        id="embed-open"
        class="embed-open"
        href="https://japan-2026-diorama.vercel.app/"
        target="_blank"
        rel="noopener noreferrer"
        hidden
      >
        全画面で開く
        <small lang="en">Open fullscreen</small>
      </a>

      <header class="hud">
        <div class="hud-title">
          <p class="eyebrow">旅トレイ <span lang="en" class="lang-en">Trip tray</span></p>
          <h1>Japan 2026</h1>
          <p id="hud-meta" class="hud-meta"></p>
        </div>
        <div class="hud-tools">
          <button type="button" id="zoom-out" class="icon-btn" aria-label="ズームアウト / Zoom out">−</button>
          <button type="button" id="zoom-in" class="icon-btn" aria-label="ズームイン / Zoom in">+</button>
          <button type="button" id="reset-view" class="text-btn" aria-label="リセット / Reset">
            リセット
            <small lang="en">Reset</small>
          </button>
        </div>
      </header>

      <p id="loading" class="loading-pill" role="status">
        模型を読み込み中…
        <span lang="en" class="lang-en">Loading models…</span>
      </p>

      <nav id="city-chips" class="city-nav" aria-label="都市 / Cities"></nav>

      <p id="hint" class="hint">
        街をタップ · ドラッグで回転
        <span lang="en" class="lang-en">Tap a city · drag to orbit</span>
      </p>

      <section id="sheet" class="sheet" aria-live="polite" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <button type="button" id="sheet-close" class="sheet-close" aria-label="閉じる / Close">
          閉じる
          <small lang="en">Close</small>
        </button>
        <div id="sheet-body"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
