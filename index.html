<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2130" />
    <meta name="description" content="Trip Replay — 3D maps of my trips with real-sun lighting and a day-by-day replay." />
    <meta property="og:title" content="Trip Replay" />
    <meta property="og:description" content="Replay each trip on a 3D map: real rail routes, landmarks and the light of each hour." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trip-replay.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Trip Replay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="home" hidden>
      <header class="home-head">
        <p class="home-eyebrow">Trip Replay</p>
        <h1>ทริปของ Jojo</h1>
        <p class="home-sub">เลือกทริปเพื่อดูแผนที่ 3 มิติ แสงตามเวลาจริง และเล่นทริปย้อนหลังทีละจุด</p>
      </header>
      <nav id="trip-cards" class="trip-cards" aria-label="ทริปทั้งหมด"></nav>
    </main>

    <div id="map" role="application" aria-label="แผนที่ทริป 3 มิติ"></div>
    <div id="badges"></div>

    <a id="embed-open" class="embed-open" href="https://trip-replay.vercel.app/" target="_blank" rel="noopener noreferrer" hidden>
      เปิดเต็มจอ ↗
    </a>

    <div id="clock" role="status" aria-live="off"><span class="ico" aria-hidden="true">☾</span><span class="txt"></span></div>

    <aside id="panel" aria-label="แผนการเดินทาง">
      <div id="grip" role="button" tabindex="0" aria-label="ขยายหรือย่อรายการ" aria-expanded="true"><span></span></div>
      <header>
        <div class="titles">
          <a class="back" href="/">← ทริปทั้งหมด</a>
          <h1></h1>
          <div class="sub"></div>
        </div>
        <button id="play-trip" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>เล่นทริป
        </button>
      </header>
      <nav id="days" aria-label="เลือกวัน"></nav>
      <div id="list"></div>
    </aside>

    <div id="fabs">
      <button class="fab" id="orbit" type="button" aria-pressed="false" aria-label="หมุนรอบจุดกลาง" title="หมุนรอบจุดกลาง">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 0 6.9 8.2h-2.1A5 5 0 1 1 12 7v3l4-4-4-4z" /></svg>
      </button>
      <button class="fab" id="pitch" type="button" aria-label="สลับ 2D หรือ 3D">2D</button>
    </div>

    <section id="playbar" hidden aria-label="เล่นทริปย้อนหลัง">
      <div id="pb-now"><span class="ic"></span><span class="t"><span class="ttl"></span><span class="sub"></span></span></div>
      <div class="row">
        <button id="pb-prev" type="button" aria-label="จุดก่อนหน้า"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg></button>
        <button id="pb-play" type="button" class="primary" aria-label="เล่น"></button>
        <button id="pb-next" type="button" aria-label="จุดถัดไป"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg></button>
        <div class="track"><div id="ticks"></div><input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="ตำแหน่งในทริป" /></div>
        <button id="pb-speed" type="button" aria-label="ความเร็ว">1×</button>
        <button id="pb-close" type="button" aria-label="ออกจากโหมดเล่นทริป"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z" /></svg></button>
      </div>
    </section>

    <div id="daycard" aria-hidden="true"><span class="w"></span><span class="d"></span><span class="c"></span></div>

    <div id="fatal" hidden role="alert">โหลดทริปไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
