    <main id="home" hidden>
      <header class="home-head">
        <p class="home-eyebrow">Trip Replay</p>
        <h1>ทริปของ Jojo</h1>
        <p class="home-sub">เลือกทริปเพื่อดูแผนที่ 3 มิติ แสงตามเวลาจริง และเล่นทริปย้อนหลังทีละจุด</p>
      </header>
      <nav id="trip-cards" class="trip-cards" aria-label="ทริปทั้งหมด"></nav>
    </main>

    <div id="map" role="application" aria-label="แผนที่ทริป 3 มิติ"></div>
    <div id="badges"></div>

    <a id="embed-open" class="embed-open mm-btn mm-btn--secondary mm-btn--sm" href="https://trip-replay.vercel.app/" target="_blank" rel="noopener noreferrer" hidden>
      เปิดเต็มจอ<svg class="mm-ico" aria-hidden="true"><use href="#i-external" /></svg>
    </a>

    <div id="clock" role="status" aria-live="off"><svg class="mm-ico ico" aria-hidden="true"><use href="#i-moon" /></svg><span class="txt"></span></div>

    <aside id="panel" aria-label="แผนการเดินทาง">
      <div id="grip" role="button" tabindex="0" aria-label="ขยายหรือย่อรายการ" aria-expanded="true"><span></span></div>
      <header>
        <div class="titles">
          <a class="back" href="/"><svg class="mm-ico" aria-hidden="true"><use href="#i-arrow-left" /></svg>ทริปทั้งหมด</a>
          <h1></h1>
          <div class="sub"></div>
        </div>
        <button id="play-trip" class="mm-btn mm-btn--primary mm-btn--sm" type="button" disabled>
          <svg class="mm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>เล่นทริป
        </button>
      </header>
      <nav id="days" aria-label="เลือกวัน"></nav>
      <div id="list"></div>
    </aside>

    <div id="fabs">
      <button class="fab mm-btn mm-btn--secondary mm-btn--icon" id="orbit" type="button" aria-pressed="false" aria-label="หมุนรอบจุดกลาง" title="หมุนรอบจุดกลาง">
        <svg class="mm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 0 6.9 8.2h-2.1A5 5 0 1 1 12 7v3l4-4-4-4z" /></svg>
      </button>
      <button class="fab mm-btn mm-btn--secondary mm-btn--icon" id="pitch" type="button" aria-label="สลับ 2D หรือ 3D">2D</button>
    </div>

    <section id="playbar" hidden aria-label="เล่นทริปย้อนหลัง">
      <div id="pb-now"><span class="ic"></span><span class="t"><span class="ttl"></span><span class="sub"></span></span></div>
      <div class="row">
        <button id="pb-prev" class="mm-btn mm-btn--secondary mm-btn--icon mm-btn--sm" type="button" aria-label="จุดก่อนหน้า"><svg class="mm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg></button>
        <button id="pb-play" type="button" class="mm-btn mm-btn--primary mm-btn--icon" aria-label="เล่น"></button>
        <button id="pb-next" class="mm-btn mm-btn--secondary mm-btn--icon mm-btn--sm" type="button" aria-label="จุดถัดไป"><svg class="mm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg></button>
        <div class="track"><div id="ticks"></div><input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="ตำแหน่งในทริป" /></div>
        <button id="pb-speed" class="mm-btn mm-btn--secondary mm-btn--sm" type="button" aria-label="ความเร็ว">1×</button>
        <button id="pb-close" class="mm-btn mm-btn--secondary mm-btn--icon mm-btn--sm" type="button" aria-label="ออกจากโหมดเล่นทริป"><svg class="mm-ico" aria-hidden="true"><use href="#i-close" /></svg></button>
      </div>
    </section>

    <div id="daycard" aria-hidden="true"><span class="w"></span><span class="d"></span><span class="c"></span></div>

    <div id="fatal" hidden role="alert">โหลดทริปไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
